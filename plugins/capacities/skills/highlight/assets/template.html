<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --border: #E3E5EA;
    --text: #1C1E26;
    --text-muted: #6B7080;
    --accent: #4C5FD5;
    --accent-text: #FFFFFF;
    --highlight-bg: #FFE066;
    --highlight-text: #2A2100;
    --code-bg: #EEF0F4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151B;
      --surface: #1C1E27;
      --border: #2C2F3A;
      --text: #ECEDF2;
      --text-muted: #9296A6;
      --accent: #7C89FF;
      --accent-text: #10121A;
      --highlight-bg: #E8B84B;
      --highlight-text: #1D1300;
      --code-bg: #262935;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14151B; --surface: #1C1E27; --border: #2C2F3A; --text: #ECEDF2;
    --text-muted: #9296A6; --accent: #7C89FF; --accent-text: #10121A;
    --highlight-bg: #E8B84B; --highlight-text: #1D1300; --code-bg: #262935;
  }
  :root[data-theme="light"] {
    --bg: #F5F6F8; --surface: #FFFFFF; --border: #E3E5EA; --text: #1C1E26;
    --text-muted: #6B7080; --accent: #4C5FD5; --accent-text: #FFFFFF;
    --highlight-bg: #FFE066; --highlight-text: #2A2100; --code-bg: #EEF0F4;
  }

  * { box-sizing: border-box; }

  .page {
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    justify-content: center;
    padding: 48px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
  }

  .card {
    width: 100%;
    max-width: 640px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 36px;
    height: fit-content;
  }

  .eyebrow-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .eyebrow .swatch {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: var(--highlight-bg);
    flex-shrink: 0;
  }

  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s ease;
    white-space: nowrap;
  }
  .copy-btn:hover { opacity: 0.88; }
  .copy-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .copy-btn[data-copied="true"] { background: #2FA86A; }

  .content {
    font-size: 17px;
    line-height: 1.75;
    max-width: 66ch;
  }
  .content p { margin: 0 0 1em; }
  .content p:last-child { margin-bottom: 0; }

  .content strong { font-weight: 700; }
  .content em { font-style: italic; }
  .content code {
    font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    font-size: 0.88em;
    background: var(--code-bg);
    padding: 0.15em 0.4em;
    border-radius: 4px;
  }
  .content mark {
    background: var(--highlight-bg);
    color: var(--highlight-text);
    padding: 0.05em 0.2em;
    border-radius: 3px;
  }
  .content u {
    text-decoration: underline;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
  }

  .footnote {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--text-muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .copy-btn { transition: none; }
  }
</style>

<div class="page">
  <div class="card">
    <div class="eyebrow-row">
      <span class="eyebrow"><span class="swatch"></span>Formatted for Capacities</span>
      <button class="copy-btn" id="copy-btn" type="button">Copy Markdown</button>
    </div>
    <div class="content">
{{CONTENT_HTML}}
    </div>
    <div class="footnote">วางลง Capacities ได้ทันที — markdown ที่ copy ตรงกับที่ render ไว้ด้านบนทุกตัวอักษร</div>
  </div>
</div>

<script type="application/json" id="raw-markdown-data">{{RAW_MARKDOWN_JSON}}</script>
<script>
  (function () {
    var btn = document.getElementById('copy-btn');
    var dataEl = document.getElementById('raw-markdown-data');
    var raw = '';
    try { raw = JSON.parse(dataEl.textContent); } catch (e) { raw = dataEl.textContent; }

    btn.addEventListener('click', function () {
      navigator.clipboard.writeText(raw).then(function () {
        var original = btn.textContent;
        btn.textContent = 'Copied ✓';
        btn.setAttribute('data-copied', 'true');
        setTimeout(function () {
          btn.textContent = original;
          btn.removeAttribute('data-copied');
        }, 1600);
      });
    });
  })();
</script>
